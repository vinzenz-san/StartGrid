# Service name kept as-is (already deployed) even though this Worker now
# proxies both Unsplash and NASA — renaming would mint a new .workers.dev
# URL and orphan the deployed one.
name = "startgrid-unsplash-proxy"
main = "api-proxy.ts"
compatibility_date = "2024-01-01"

# Set secrets via:
#   wrangler secret put UNSPLASH_ACCESS_KEY
#   wrangler secret put NASA_API_KEY
#   wrangler secret put GOOGLE_CLIENT_ID
#   wrangler secret put GOOGLE_CLIENT_SECRET
#   wrangler secret put MS_CLIENT_ID
#   wrangler secret put MS_CLIENT_SECRET
# Optionally: wrangler secret put ALLOWED_ORIGIN
#   Comma-separated list of extra allowed origins, replacing the built-in
#   Chrome extension origin in api-proxy.ts (Firefox moz-extension:// origins
#   and the web origins listed there stay allowed either way). Needed if the
#   Chrome Web Store item's ID differs from the one the pinned signing key
#   produces — see the allowlist comment in api-proxy.ts.
